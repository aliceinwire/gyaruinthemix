# Include inside the existing web server {}. Runtime DNS keeps default-off web
# startup independent of the optional sidecar. Existing global/game CSP unchanged
# here. Only the game page requires media-src 'self' blob: upon activation.
location ^~ /game-audio/ {
  set $game_audio_backend http://game-audio:3001;
  proxy_pass $game_audio_backend;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection '';
  proxy_set_header X-Forwarded-For '';
  proxy_set_header X-Real-IP '';
  proxy_connect_timeout 2s;
  proxy_read_timeout 10s;
  proxy_send_timeout 10s;
  proxy_buffering off;
  proxy_cache off;
  proxy_no_cache 1;
  client_max_body_size 1k;
  include /etc/nginx/security-headers.conf;
  add_header Cache-Control 'private, no-store, max-age=0' always;
  add_header X-Robots-Tag 'noindex, nofollow, noarchive' always;
}
