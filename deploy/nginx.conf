worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 15;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 15s;
  client_max_body_size 256k;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # No IPs, query strings, headers, customer data, or request bodies in logs.
  log_format safe escape=json '{"event":"http","method":"$request_method","status":$status,"duration":$request_time}';
  access_log /dev/stdout safe;
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/security-headers.conf;
    location = /web-health {
      access_log off;
      default_type text/plain;
      return 200 'ok';
    }
    include /etc/nginx/checkout-location.conf;
    location /_astro/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control 'public, max-age=31536000, immutable';
      try_files $uri =404;
    }
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control 'public, max-age=3600';
      try_files $uri =404;
    }
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control 'no-cache';
      try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
    error_page 404 /404.html;
  }
}
