worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  # Native module imports enforce JavaScript MIME, including vendored HLS.
  # Extend the standard map at the same level; do not replace it per location.
  types { application/javascript mjs; }
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 15;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 15s;
  client_max_body_size 256k;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # No IPs, query strings, headers, customer data, or request bodies in logs.
  log_format safe escape=json '{"event":"http","method":"$request_method","status":$status,"duration":$request_time}';
  access_log /dev/stdout safe;
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080 default_server;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/security-headers.conf;
    location = /web-health {
      access_log off;
      default_type text/plain;
      return 200 'ok';
    }
    include /etc/nginx/checkout-location.conf;
    include /etc/nginx/game-audio.conf;
    # Keep existing bookmarks and asset URLs working after the move.
    location = /game-test { return 308 /game/$is_args$args; }
    location ~ ^/game-test/(?<legacy_game_path>.*)$ {
      return 308 /game/$legacy_game_path$is_args$args;
    }
    # Unlisted game. This is not password protection.
    location = /game { return 308 /game/$is_args$args; }
    location ^~ /game/ {
      include /etc/nginx/game-security-headers.conf;
      add_header X-Robots-Tag 'noindex, nofollow, noarchive' always;
      add_header Cache-Control 'no-cache' always;
      try_files $uri $uri/ =404;
    }
    location /_astro/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control 'public, max-age=31536000, immutable';
      try_files $uri =404;
    }
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control 'public, max-age=3600';
      try_files $uri =404;
    }
    location = /podcast/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control 'no-cache';
      try_files /.podcast-live/ja.html /podcast/index.html =404;
    }
    location = /en/podcast/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control 'no-cache';
      try_files /.podcast-live/en.html /en/podcast/index.html =404;
    }
    location = /podcast/index.html { return 308 /podcast/; }
    location = /en/podcast/index.html { return 308 /en/podcast/; }
    location ~ "^/podcast/play/([^./][^/]*)/([mM][pP]3)$" {
      # Opening a player URL in a browser tab takes listeners back to the show.
      if ($http_sec_fetch_dest = document) { return 302 /podcast/; }
      alias /tmp/podcast-pages/current/audio/$1.$2;
      disable_symlinks if_not_owner from=/tmp/podcast-pages/current;
      etag off;
      if_modified_since off;
      default_type audio/mpeg;
      include /etc/nginx/security-headers.conf;
      add_header Content-Disposition inline;
      add_header Vary Sec-Fetch-Dest always;
      add_header Cache-Control 'no-cache' always;
    }
    location ~ "^/podcast/audio/([^./][^/]*(?i:\.mp3))$" {
      alias /tmp/podcast-pages/current/audio/$1;
      disable_symlinks if_not_owner from=/tmp/podcast-pages/current;
      etag off;
      if_modified_since off;
      default_type audio/mpeg;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control 'no-cache';
    }
    location ~ "^/podcast/artwork/([a-f0-9]{64}\.(?:jpg|png|gif|webp))$" {
      alias /var/lib/podcast/artwork/$1;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control 'public, max-age=86400';
    }
    location = /podcast/rss.xml {
      include /etc/nginx/security-headers.conf;
      types { application/rss+xml xml; }
      charset utf-8;
      add_header Cache-Control 'no-cache';
      try_files /.podcast-live/rss.xml $uri =404;
    }
    location /en/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control 'no-cache';
      try_files $uri $uri/ =404;
      error_page 404 /en/404/index.html;
    }
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control 'no-cache';
      try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
    error_page 404 /404.html;
  }
  include /etc/nginx/www-redirect.conf;
}
