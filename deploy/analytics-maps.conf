# Only categorical page/source/device data is persisted. Client addresses are
# sent over loopback solely for daily hashing, never to stdout or a log file.
map $request_uri $analytics_page {
  default "";
  "~^/(?:index\.html)?(?:\?|$)" "/";
  "~^/en(?:/(?:index\.html)?)?(?:\?|$)" "/en/";
  "~^/about(?:/(?:index\.html)?)?(?:\?|$)" "/about/";
  "~^/en/about(?:/(?:index\.html)?)?(?:\?|$)" "/en/about/";
  "~^/music(?:/(?:index\.html)?)?(?:\?|$)" "/music/";
  "~^/en/music(?:/(?:index\.html)?)?(?:\?|$)" "/en/music/";
  "~^/podcast(?:/(?:index\.html)?)?(?:\?|$)" "/podcast/";
  "~^/en/podcast(?:/(?:index\.html)?)?(?:\?|$)" "/en/podcast/";
  "~^/live(?:/(?:index\.html)?)?(?:\?|$)" "/live/";
  "~^/en/live(?:/(?:index\.html)?)?(?:\?|$)" "/en/live/";
  "~^/news(?:/(?:index\.html)?)?(?:\?|$)" "/news/";
  "~^/en/news(?:/(?:index\.html)?)?(?:\?|$)" "/en/news/";
  "~^/fanclub(?:/(?:index\.html)?)?(?:\?|$)" "/fanclub/";
  "~^/en/fanclub(?:/(?:index\.html)?)?(?:\?|$)" "/en/fanclub/";
  "~^/shop(?:/(?:index\.html)?)?(?:\?|$)" "/shop/";
  "~^/en/shop(?:/(?:index\.html)?)?(?:\?|$)" "/en/shop/";
  "~^/contact(?:/(?:index\.html)?)?(?:\?|$)" "/contact/";
  "~^/en/contact(?:/(?:index\.html)?)?(?:\?|$)" "/en/contact/";
  "~^/legal(?:/(?:index\.html)?)?(?:\?|$)" "/legal/";
  "~^/en/legal(?:/(?:index\.html)?)?(?:\?|$)" "/en/legal/";
  "~^/privacy(?:/(?:index\.html)?)?(?:\?|$)" "/privacy/";
  "~^/en/privacy(?:/(?:index\.html)?)?(?:\?|$)" "/en/privacy/";
  "~^/game(?:/(?:index\.html)?)?(?:\?|$)" "/game/";
}
map $http_referer $analytics_source {
  default other;
  "" direct;
  "~*^https?://(?:www\.)?gyaruinthemix\.com(?::[0-9]+)?(?:/|$)" internal;
  "~*^https?://(?:[a-z0-9-]+\.)?instagram\.com(?:/|$)" instagram;
  "~*^https?://(?:[a-z0-9-]+\.)?tiktok\.com(?:/|$)" tiktok;
  "~*^https?://(?:www\.)?google\.(?:com|co\.jp)(?:/|$)" google;
  "~*^https?://(?:www\.)?bing\.com(?:/|$)" bing;
  "~*^https?://(?:www\.)?(?:t\.co|x\.com|twitter\.com)(?:/|$)" x;
  "~*^https?://(?:www\.)?(?:youtube\.com|youtu\.be)(?:/|$)" youtube;
  "~*^https?://(?:[a-z0-9-]+\.)?facebook\.com(?:/|$)" facebook;
}
map $http_user_agent $analytics_bot {
  default 0;
  "" 1;
  "~*bot|crawler|spider|slurp|headless|curl|wget|python|preview|facebookexternalhit" 1;
}
map $http_user_agent $analytics_device {
  default desktop;
  "" unknown;
  "~*ipad|tablet|android(?!.*mobile)" tablet;
  "~*mobi|iphone|ipod" mobile;
}
map $http_user_agent $analytics_browser {
  default other;
  "~*firefox|fxios" firefox;
  "~*edg" edge;
  "~*chrome|crios" chrome;
  "~*safari" safari;
}
map "$request_method:$status:$analytics_page:$analytics_bot" $analytics_count {
  default 0;
  "~^GET:(?:200|304|400|401|403|404|408|429|500|502|503|504):/[^:]*:0$" 1;
}
log_format analytics escape=json '{"time":"$msec","page":"$analytics_page","source":"$analytics_source","device":"$analytics_device","status":$status,"peer":"$remote_addr","client":"$http_x_real_ip","browser":"$analytics_browser"}';
