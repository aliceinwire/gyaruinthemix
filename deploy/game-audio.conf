# The canonical web image always supports the optional bouncer audio service.
# Resolve at request time so an absent default-off sidecar cannot block startup.
location = /game-audio/v1/config {
  include /etc/nginx/game-audio-proxy.conf;
  proxy_intercept_errors on;
  error_page 502 503 504 = @game_audio_disabled;
}
location ^~ /game-audio/ {
  include /etc/nginx/game-audio-proxy.conf;
}
location @game_audio_disabled {
  internal;
  include /etc/nginx/security-headers.conf;
  default_type application/json;
  add_header Cache-Control 'private, no-store, max-age=0' always;
  add_header X-Robots-Tag 'noindex, nofollow, noarchive' always;
  return 200 '{"enabled":false}';
}
