# Only the explicitly supported www alias redirects. Keep the default server
# separate so localhost health checks and other deployment hosts still work.
server {
  listen 8080;
  server_name www.gyaruinthemix.com;
  include /etc/nginx/security-headers.conf;

  location = /web-health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # The existing edge proxy/ACME companion serves HTTP-01 tokens. A challenge
  # reaching this application is misrouted: fail closed instead of redirecting.
  location ^~ /.well-known/acme-challenge/ { return 404; }

  location / {
    # Fixed HTTPS authority; never interpolate Host or forwarding headers.
    # request_uri keeps the original escaped path and query. 308 keeps methods.
    return 308 https://gyaruinthemix.com$request_uri;
  }
}
